<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.3/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

{% include 'navbar.html' %}

<div class="container mt-5">
    <h2 class="text-center mb-4">Crear cuenta</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="POST" novalidate>
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary d-block mx-auto mt-3">Registrarse</button>
            </form>

            {% if messages %}
                <div class="mt-3">
                    {% for message in messages %}
                        <div class="alert alert-warning">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    </div>
</div>

{% include 'footer.html' %}

<script src="{% static 'bootstrap-5.3.3/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
